<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
<defs>
<linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6ffd6"/><stop offset=".25" stop-color="#3ff2a2"/><stop offset="1" stop-color="#0aa57a"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9f1ff"/><stop offset=".25" stop-color="#38c8ff"/><stop offset="1" stop-color="#1568e0"/></linearGradient>
<linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5dffc4"/><stop offset=".5" stop-color="#25d3d8"/><stop offset="1" stop-color="#2a9cff"/></linearGradient>
<linearGradient id="sw" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2cf59a"/><stop offset=".5" stop-color="#20f0ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

<radialGradient id="bg" cx=".5" cy=".38" r=".8"><stop offset="0" stop-color="#14465a"/><stop offset=".55" stop-color="#0a2536"/><stop offset="1" stop-color="#051019"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5dffc4" stop-opacity=".7"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#2a9cff" stop-opacity=".7"/></linearGradient>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="url(#rim)" stroke-width="5"/>
<g transform="translate(256 256) scale(.98) translate(-256 -248)"><g id="mark">
<!-- diagonal slab -->
<polygon points="144,160 206,132 370,346 308,376" fill="url(#gd)"/>
<polygon points="206,132 370,346 352,354 190,140" fill="#ffffff" opacity=".22"/>
<!-- pillars -->
<polygon points="136,376 136,168 204,134 204,376" fill="url(#g1)"/>
<polygon points="136,168 204,134 204,150 136,184" fill="#ffffff" opacity=".35"/>
<polygon points="308,376 308,134 376,168 376,376" fill="url(#g2)"/>
<polygon points="308,134 376,168 376,184 308,150" fill="#ffffff" opacity=".35"/>
