<g fill="#eafff6" opacity=".85"><rect x="152" y="214" width="10" height="14" rx="2"/><rect x="152" y="246" width="10" height="14" rx="2"/><rect x="152" y="278" width="10" height="14" rx="2"/><rect x="174" y="230" width="10" height="14" rx="2"/><rect x="174" y="262" width="10" height="14" rx="2"/></g>
<g fill="#f0fbff" opacity=".85"><rect x="328" y="214" width="10" height="14" rx="2"/><rect x="328" y="246" width="10" height="14" rx="2"/><rect x="328" y="278" width="10" height="14" rx="2"/><rect x="350" y="230" width="10" height="14" rx="2"/><rect x="350" y="262" width="10" height="14" rx="2"/></g>
<!-- sky swoosh -->
<path d="M84 404 C 170 322 300 276 438 292 C 330 302 214 344 84 404 Z" fill="url(#sw)" filter="url(#glow)"/>
</g>
</g>
</svg>
